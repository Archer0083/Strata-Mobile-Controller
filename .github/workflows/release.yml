name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.0.10"
        required: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Compute checksum
        run: |
          sha256sum build/app/outputs/flutter-apk/app-debug.apk \
            > build/app/outputs/flutter-apk/app-debug.apk.sha256
          cat build/app/outputs/flutter-apk/app-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/flutter-apk/app-debug.apk.sha256
          retention-days: 30
